# tmux settings for Claude Code sessions (copy to ~/.tmux.conf).
# Scroll with the mouse wheel and select text as in a plain terminal.
set -g mouse on
set -g history-limit 50000
# Claude Code reads Esc on its own: don't hold it waiting for a key combination.
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
# Shift+Enter (new line in Claude Code) needs the terminal's extended keys.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# A thin status line with the session name (what the Buddy shows too).
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour173]● #S "
set -g status-right ""
set -g status-left-length 40
