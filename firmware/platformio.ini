; Claude Buddy firmware.
; - wokwi_s3: ESP32-S3 + ILI9341 320x240 with FT6206 touch, simulated in Wokwi
;   (the ESP32-C5 is still alpha in Wokwi; the UI and protocol code are the same).
; - m5_cores3: the M5Stack CoreS3 (the real Buddy): 2" 320x240 touch, mics,
;   speaker, battery. Flash over USB-C: pio run -e m5_cores3 -t upload
; - native: protocol/state unit tests on the host, no board needed.
; The NM-CYD-C5 can come back as a status-only Buddy: add a board_*.cpp in src/hal.

[platformio]
default_envs = wokwi_s3

[common]
; pioarduino: Arduino core 3.x for ESP32 (incl. the C5), unlike the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@~9.2.2
    links2004/WebSockets@^2.6.1
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

[env:wokwi_s3]
extends = common
board = esp32-s3-devkitc-1
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    ${common.build_flags}
    -DBOARD_WOKWI_S3
    ; Wokwi's simulated WiFi; host.wokwi.internal reaches this machine through
    ; the Wokwi gateway. Token: export BUDDY_HUB_TOKEN before building.
    -DBUDDY_WIFI_SSID=\"Wokwi-GUEST\"
    -DBUDDY_HUB_HOST=\"host.wokwi.internal\"
    -DBUDDY_HUB_TOKEN=\"${sysenv.BUDDY_HUB_TOKEN}\"
monitor_speed = 115200

[env:m5_cores3]
extends = common
board = m5stack-cores3
lib_deps =
    ${common.lib_deps}
    ; M5GFX (pulled in by M5Unified) embeds its own LovyanGFX: never add both.
    m5stack/M5Unified@^0.2.5
build_flags =
    ${common.build_flags}
    -DBOARD_M5_CORES3
    ; Defaults baked in at build time (the values saved on the device win):
    ; export BUDDY_WIFI_SSID / BUDDY_WIFI_PASSWORD / BUDDY_HUB_HOST / BUDDY_HUB_TOKEN,
    ; or set them later over USB serial with a "_config" message (README).
    -DBUDDY_WIFI_SSID=\"${sysenv.BUDDY_WIFI_SSID}\"
    -DBUDDY_WIFI_PASSWORD=\"${sysenv.BUDDY_WIFI_PASSWORD}\"
    -DBUDDY_HUB_HOST=\"${sysenv.BUDDY_HUB_HOST}\"
    -DBUDDY_HUB_TOKEN=\"${sysenv.BUDDY_HUB_TOKEN}\"
monitor_speed = 115200

[env:native]
; Host-side unit tests of src/app (protocol, mood): pio test -e native
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<app/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -std=gnu++17
