; Claude Buddy firmware.
; - wokwi_s3: ESP32-S3 + ILI9341 320x240 with FT6206 touch, simulated in Wokwi
;   (the ESP32-C5 is still alpha in Wokwi; the UI and protocol code are the same).
; - native: protocol/state unit tests on the host, no board needed.
; The real NM-CYD-C5 env is added once the board's display/touch chips are known.

[platformio]
default_envs = wokwi_s3

[common]
; pioarduino: Arduino core 3.x for ESP32 (incl. the C5), unlike the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@~9.2.2
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

[env:wokwi_s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DBOARD_WOKWI_S3
monitor_speed = 115200

[env:native]
; Host-side unit tests of src/app (protocol, mood): pio test -e native
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<app/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -std=gnu++17
