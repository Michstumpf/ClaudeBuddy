<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy Simulator</title>
<style>
  :root {
    --bg: #1d1b19; --panel: #2a2724; --text: #ece7e1; --muted: #9b948c;
    --shell: #e8dccb; --shell-dark: #c9b9a3; --accent: #d97757;
    --scr-bg: #0e0f12; --scr-fg: #f2efe9; --ok: #4caf7a; --warn: #e8b04a; --bad: #e0574f; --info: #6aa8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; padding: 32px 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }

  /* ---- the device: retro TV shell around a 320x240 screen, scaled 2x ---- */
  .device { position: relative; padding-top: 70px; }
  .antenna { position: absolute; top: 0; left: 50%; width: 4px; height: 60px; background: var(--shell-dark); transform: translateX(-50%) rotate(14deg); transform-origin: bottom; }
  .antenna::after { content: ""; position: absolute; top: -10px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #555; transition: background .2s, box-shadow .2s; }
  .device.alert .antenna::after { background: var(--accent); box-shadow: 0 0 18px var(--accent); }
  .shell { background: var(--shell); border-radius: 36px; padding: 28px 28px 56px; box-shadow: inset 0 -8px 0 var(--shell-dark), 0 18px 40px #0008; }
  .bezel { background: #111; border-radius: 18px; padding: 14px; }
  .screen-wrap { width: 640px; height: 480px; overflow: hidden; border-radius: 6px; }
  .screen { width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: var(--scr-bg); color: var(--scr-fg);
            position: relative; overflow: hidden; font: 11px/1.3 ui-monospace, Consolas, monospace; user-select: none; }
  .feet { display: flex; justify-content: space-between; padding: 0 60px; }
  .feet span { width: 50px; height: 18px; background: var(--shell-dark); border-radius: 0 0 10px 10px; }
  .mic-holes { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .mic-holes i { width: 5px; height: 5px; border-radius: 50%; background: #0005; }

  /* ---- screen views (all sized for 320x240) ---- */
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; padding: 4px 8px; background: #1b1d22; display: flex; justify-content: space-between; color: #b9b4ad; }
  .face { position: absolute; left: 0; right: 0; top: 0; bottom: 22px; }
  .eyes { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); display: flex; gap: 60px; }
  .eye { width: 44px; height: 56px; background: var(--scr-fg); border-radius: 22px; position: relative; transition: height .12s, transform .3s, border-radius .2s; }
  .mouth { position: absolute; top: 148px; left: 50%; width: 46px; height: 10px; transform: translateX(-50%); border-bottom: 4px solid var(--scr-fg); border-radius: 0 0 30px 30px; transition: all .2s; }
  .label { position: absolute; top: 176px; left: 0; right: 0; text-align: center; color: #b9b4ad; }
  .blink .eye { height: 6px; transform: translateY(25px); }
  .s-sleep .eye { height: 6px; transform: translateY(25px); border-radius: 3px; }
  .s-sleep .mouth { width: 18px; height: 6px; border-bottom-width: 3px; }
  .s-work .eyes { animation: scan 1.6s ease-in-out infinite; }
  .s-work .eye { height: 34px; transform: translateY(14px); border-radius: 12px 12px 22px 22px; }
  .s-work .mouth { width: 22px; border-radius: 0; height: 2px; }
  .s-wait .eye { width: 52px; height: 64px; background: var(--warn); }
  .s-wait .mouth { width: 18px; height: 18px; border: 4px solid var(--warn); border-radius: 50%; }
  .s-done .eye { height: 26px; border-radius: 26px 26px 4px 4px; background: var(--ok); }
  .s-done .mouth { width: 70px; height: 22px; border-bottom-color: var(--ok); }
  .s-off .eye { background: none; height: 44px; }
  .s-off .eye::before, .s-off .eye::after { content: ""; position: absolute; left: 20px; top: 0; width: 5px; height: 44px; background: var(--bad); transform: rotate(45deg); }
  .s-off .eye::after { transform: rotate(-45deg); }
  .s-off .mouth { border-bottom-color: var(--bad); border-radius: 30px 30px 0 0; border-top: 4px solid var(--bad); border-bottom: 0; }
  .s-listen .eye { background: var(--info); }
  .s-listen .mouth { width: 30px; height: 30px; border: 4px solid var(--info); border-radius: 50%; }
  @keyframes scan { 0%,100% { margin-left: -14px } 50% { margin-left: 14px } }

  .list { position: absolute; inset: 0 0 22px 0; overflow-y: auto; padding: 4px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 4px; background: #181a1f; margin-bottom: 4px; cursor: pointer; }
  .row:active { background: #262a31; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .host { color: #7d776f; font-size: 9px; }
  .st-working { background: var(--info) } .st-waiting { background: var(--warn) } .st-done { background: var(--ok) }
  .st-idle { background: #777 } .st-offline { background: #333 }

  .pad { position: absolute; inset: 0 0 22px 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .title { font-weight: bold; font-size: 12px; }
  .box { background: #181a1f; border-radius: 4px; padding: 6px; flex: 1; overflow: hidden; word-break: break-word; }
  .btns { display: flex; gap: 6px; }
  .btn { flex: 1; border: 0; border-radius: 6px; padding: 9px 4px; font: bold 11px ui-monospace, monospace; color: #fff; background: #3a3f48; cursor: pointer; }
  .btn.ok { background: #2f8a5b } .btn.bad { background: #b8423b } .btn.info { background: #3c6fc4 }
  .btn:active { filter: brightness(1.3); }
  .danger { color: var(--bad); font-weight: bold; }
  .timer { height: 3px; background: var(--warn); transition: width 1s linear; }
  #dictInput { width: 100%; background: #0e0f12; color: var(--scr-fg); border: 1px solid #333; font: 11px ui-monospace, monospace; padding: 4px; }

  /* ---- dev panel ---- */
  .panel { background: var(--panel); border-radius: 12px; padding: 16px; width: 340px; max-width: 100%; }
  .panel section { margin-bottom: 18px; }
  .panel input { width: 100%; padding: 6px 8px; background: #1a1816; color: var(--text); border: 1px solid #444; border-radius: 6px; }
  .panel button { background: #3a3632; color: var(--text); border: 0; border-radius: 6px; padding: 7px 10px; margin: 0 4px 6px 0; cursor: pointer; font-size: 13px; }
  .panel button:hover { background: #4a453f; }
  .conn { font-size: 13px; } .conn b { color: var(--ok); } .conn b.off { color: var(--bad); }
  #log { font: 11px ui-monospace, monospace; color: var(--muted); max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  @media (max-width: 720px) { .screen-wrap { width: 320px; height: 240px; } .screen { transform: none; } }
</style>
</head>
<body>

<div class="device" id="device">
  <div class="antenna"></div>
  <div class="shell">
    <div class="bezel"><div class="screen-wrap"><div class="screen" id="screen">

      <div class="view on" id="v-face">
        <div class="face s-sleep" id="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
          <div class="label" id="faceLabel">conectando…</div>
        </div>
      </div>

      <div class="view" id="v-list"><div class="list" id="list"></div></div>

      <div class="view" id="v-session">
        <div class="pad">
          <div class="title" id="sTitle"></div>
          <div class="box" id="sMsg"></div>
          <div class="btns">
            <button class="btn" data-go="list">◀ Voltar</button>
            <button class="btn info" id="sDictate">🎤 Ditar</button>
          </div>
        </div>
      </div>

      <div class="view" id="v-dictate">
        <div class="pad">
          <div class="title" id="dTitle">Ditar para …</div>
          <div class="box" id="dText">Segure o botão e fale.</div>
          <input id="dictInput" placeholder="(ou digite aqui)">
          <div class="btns">
            <button class="btn" id="dBack">✕</button>
            <button class="btn info" id="dHold">🎤 Segure</button>
            <button class="btn ok" id="dSend">Enviar ▶</button>
          </div>
        </div>
      </div>

      <div class="view" id="v-approve">
        <div class="timer" id="aTimer" style="width:100%"></div>
        <div class="pad" style="top:3px">
          <div class="title" id="aTitle"></div>
          <div class="box" id="aBody"></div>
          <div class="btns">
            <button class="btn bad" id="aDeny">✕ Negar</button>
            <button class="btn ok" id="aAllow">✓ Aprovar</button>
          </div>
        </div>
      </div>

      <div class="bar"><span id="barLeft">—</span><span id="barRight"></span></div>
    </div></div></div>
    <div class="mic-holes"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="feet"><span></span><span></span></div>
</div>

<div class="panel">
  <section>
    <h2>Conexão com o hub</h2>
    <input id="token" placeholder="token (de ~/.config/claude-buddy/token)">
    <p class="conn">Estado: <b id="connState" class="off">desconectado</b></p>
  </section>
  <section>
    <h2>Simular eventos do Claude Code</h2>
    <button data-fake="start">Nova sessão</button>
    <button data-fake="work">Trabalhando</button>
    <button data-fake="done">Terminou</button>
    <button data-fake="perm">Pedir permissão</button>
    <button data-fake="danger">Permissão perigosa</button>
    <button data-fake="end">Encerrar sessão</button>
    <p style="color:var(--muted);font-size:12px;margin:4px 0 0">As sessões falsas se chamam <code>fake-api</code> e <code>fake-web</code>; os botões alternam entre elas.</p>
  </section>
  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let token = params.get("token") || (() => { try { return localStorage.getItem("buddyToken") || ""; } catch { return ""; } })();
$("token").value = token;

let ws = null, state = { sessions: [], pending: [] }, view = "face", current = null, connected = false;
let lastEvent = null, lastEventAt = 0;

function log(msg) { const el = $("log"); el.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + el.textContent; }

// ---------- websocket ----------
function connect() {
  if (ws) ws.close();
  if (!token) { setConn(false, "sem token"); return; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { setConn(true); log("conectado"); };
  ws.onclose = (e) => { setConn(false, e.code === 4401 ? "token inválido" : "desconectado"); if (e.code !== 4401) setTimeout(connect, 2000); };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
}
function setConn(ok, why) { connected = ok; $("connState").textContent = ok ? "conectado" : why; $("connState").className = ok ? "" : "off"; render(); }
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onMessage(msg) {
  if (msg.type === "state") {
    state = msg;
    if (msg.event) {
      lastEvent = msg.event; lastEventAt = Date.now();
      log(`evento: ${msg.event.kind} (${msg.event.session})`);
      if (msg.event.kind === "done") beep([880, 1320]);
      if (msg.event.kind === "attention" || msg.event.kind === "approval") beep([660, 660]);
    }
    if (state.pending.length && view !== "dictate") show("approve");
    else if (!state.pending.length && view === "approve") show("face");
    render();
  } else if (msg.type === "dictate_result") {
    log(`ditado → ${msg.session || "?"}: ${msg.ok ? "ok" : "falhou"} (${msg.detail})`);
    $("dText").textContent = msg.ok ? `✓ ${msg.detail}` : `✕ ${msg.detail}`;
    if (msg.ok) setTimeout(() => show("face"), 1200);
  } else if (msg.type === "decision_result") {
    log(`decisão ${msg.id}: ${msg.ok ? "aceita" : "recusada pelo hub"}`);
  }
}

// ---------- rendering ----------
function show(v) { view = v; document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "v-" + v)); render(); }

function mood() {
  if (!connected) return ["s-off", "sem conexão com o hub"];
  if (listening) return ["s-listen", "ouvindo…"];
  const ss = state.sessions.filter(s => s.status !== "offline");
  if (ss.some(s => s.status === "waiting")) return ["s-wait", "alguém precisa de você!"];
  if (lastEvent && lastEvent.kind === "done" && Date.now() - lastEventAt < 8000) return ["s-done", `${lastEvent.session} terminou!`];
  if (ss.some(s => s.status === "working")) return ["s-work", "trabalhando…"];
  if (ss.length) return ["s-idle", "tudo tranquilo"];
  return ["s-sleep", "zzz"];
}

function render() {
  const [m, label] = mood();
  $("face").className = "face " + m;
  $("faceLabel").textContent = label;
  $("device").classList.toggle("alert", state.pending.length > 0 || state.sessions.some(s => s.status === "waiting"));
  const counts = {};
  state.sessions.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
  $("barLeft").textContent = connected ? `▶ ${counts.working || 0}  ⏸ ${counts.waiting || 0}  ✓ ${counts.done || 0}` : "offline";
  $("barRight").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  if (view === "list") {
    $("list").innerHTML = state.sessions.length ? "" : '<div style="padding:10px;color:#777">nenhuma sessão ainda</div>';
    for (const s of state.sessions) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="dot st-${s.status}"></span><span class="name"></span><span class="host"></span>`;
      row.querySelector(".name").textContent = s.name;
      row.querySelector(".host").textContent = s.host;
      row.onclick = () => { current = s.id; show("session"); };
      $("list").appendChild(row);
    }
  }
  if (view === "session") {
    const s = state.sessions.find(x => x.id === current);
    if (!s) { show("list"); return; }
    $("sTitle").textContent = `${s.name} · ${s.status}`;
    $("sMsg").textContent = s.last_message || "(sem resposta ainda)";
    $("sDictate").disabled = !s.tmux_pane;
    $("sDictate").textContent = s.tmux_pane ? "🎤 Ditar" : "sem tmux";
  }
  if (view === "approve" && state.pending.length) {
    const a = state.pending[0];
    $("aTitle").innerHTML = "";
    $("aTitle").append(`${a.session_name} quer usar ${a.tool_name}`);
    $("aBody").innerHTML = "";
    if (a.dangerous) { const d = document.createElement("div"); d.className = "danger"; d.textContent = "⚠ comando perigoso"; $("aBody").append(d); }
    $("aBody").append(a.summary || "(sem detalhes)");
    const left = Math.max(0, a.expires_at * 1000 - Date.now());
    $("aTimer").style.width = Math.min(100, left / 200) + "%";
  }
}
setInterval(render, 1000);

// ---------- touch interactions ----------
$("v-face").onclick = () => show("list");
$("v-list").addEventListener("dblclick", () => show("face"));
document.querySelectorAll("[data-go]").forEach(b => b.onclick = (e) => { e.stopPropagation(); show(b.dataset.go); });
$("sDictate").onclick = () => {
  const s = state.sessions.find(x => x.id === current);
  $("dTitle").textContent = `Ditar para ${s ? s.name : "?"}`;
  $("dText").textContent = recognition ? "Segure o botão e fale." : "Seu navegador não tem reconhecimento de voz: digite abaixo.";
  $("dictInput").value = "";
  show("dictate");
};
$("dBack").onclick = () => show("session");
$("dSend").onclick = () => {
  const text = ($("dictInput").value || "").trim();
  if (!text) return;
  send({ type: "dictate", session_id: current, text });
  $("dText").textContent = "enviando…";
};
$("aAllow").onclick = () => decide("allow");
$("aDeny").onclick = () => decide("deny");
function decide(behavior) { const a = state.pending[0]; if (a) send({ type: "decision", id: a.id, behavior, via: "touch" }); }

// ---------- speech-to-text emulation (Web Speech API, Chrome/Edge) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SR ? new SR() : null;
let listening = false;
if (recognition) {
  recognition.lang = "pt-BR"; recognition.interimResults = true; recognition.continuous = true;
  recognition.onresult = (e) => {
    const text = Array.from(e.results).map(r => r[0].transcript).join(" ");
    $("dText").textContent = text; $("dictInput").value = text;
  };
  recognition.onend = () => { listening = false; $("dHold").textContent = "🎤 Segure"; render(); };
}
const startListen = (e) => { e.preventDefault(); if (!recognition || listening) return; listening = true; $("dHold").textContent = "🔴 Ouvindo"; recognition.start(); render(); };
const stopListen = () => { if (recognition && listening) recognition.stop(); };
$("dHold").addEventListener("pointerdown", startListen);
$("dHold").addEventListener("pointerup", stopListen);
$("dHold").addEventListener("pointerleave", stopListen);

// ---------- sound ----------
let audio = null;
function beep(freqs) {
  try {
    audio = audio || new AudioContext();
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = "square"; g.gain.value = 0.04;
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + i * 0.12); o.stop(audio.currentTime + i * 0.12 + 0.09);
    });
  } catch {}
}

// ---------- idle blinking ----------
setInterval(() => {
  const f = $("face");
  if (!f.classList.contains("s-idle") && !f.classList.contains("s-done")) return;
  f.classList.add("blink"); setTimeout(() => f.classList.remove("blink"), 140);
}, 3500);

// ---------- dev panel: fake Claude Code hook events ----------
let fakeIdx = 0;
const fakes = [
  { id: "fake-api", cwd: "/home/dev/portrait/fake-api" },
  { id: "fake-web", cwd: "/home/dev/portrait/fake-web" },
];
function fake(kind) {
  const f = fakes[fakeIdx++ % fakes.length];
  const base = { session_id: f.id, cwd: f.cwd, permission_mode: "default", buddy: { host: "simulador", tmux_session: f.id, tmux_pane: "%" + fakeIdx } };
  const map = {
    start: { hook_event_name: "SessionStart", source: "startup" },
    work: { hook_event_name: "UserPromptSubmit", prompt: "rode os testes" },
    done: { hook_event_name: "Stop", last_assistant_message: "Rodei os testes: 38 passaram, 2 falharam em payments/test_refund.py. Quer que eu corrija?" },
    perm: { hook_event_name: "PermissionRequest", tool_name: "Bash", tool_input: { command: "npm test -- --watch=false" } },
    danger: { hook_event_name: "PermissionRequest", tool_name: "Bash", tool_input: { command: "git push --force origin main" } },
    end: { hook_event_name: "SessionEnd", reason: "exit" },
  };
  log(`→ ${map[kind].hook_event_name} (${f.id})`);
  fetch("/hook", { method: "POST", headers: { "Content-Type": "application/json", "X-Buddy-Token": token }, body: JSON.stringify({ ...base, ...map[kind] }) })
    .then(r => r.json())
    .then(body => { if (map[kind].hook_event_name === "PermissionRequest") log(`← hook recebeu: ${body.decision ?? "sem decisão (diálogo normal)"}`); })
    .catch(err => log("erro: " + err));
}
document.querySelectorAll("[data-fake]").forEach(b => b.onclick = () => fake(b.dataset.fake));

$("token").addEventListener("change", () => {
  token = $("token").value.trim();
  try { localStorage.setItem("buddyToken", token); } catch {}
  connect();
});
connect();
</script>
</body>
</html>
